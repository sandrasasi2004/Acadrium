<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <!-- Definition for Shadows -->
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background cloud layout -->
  <ellipse cx="300" cy="230" rx="200" ry="120" fill="#EEF2FF" opacity="0.6" />

  <!-- Floating Icons & Connections -->
  <g stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
    <line x1="300" y1="180" x2="160" y2="160" />
    <line x1="300" y1="180" x2="200" y2="90" />
    <line x1="300" y1="180" x2="300" y2="70" />
    <line x1="300" y1="180" x2="400" y2="90" />
    <line x1="300" y1="180" x2="440" y2="160" />
  </g>

  <!-- Floating Circles with Icons -->
  <!-- 1. AI Chip Icon -->
  <g transform="translate(140, 160)" filter="url(#soft-shadow)">
    <circle cx="20" cy="20" r="28" fill="#FFFFFF" />
    <circle cx="20" cy="20" r="28" fill="#4F46E5" opacity="0.1" />
    <!-- Chip details -->
    <rect x="12" y="12" width="16" height="16" rx="2" fill="none" stroke="#4F46E5" stroke-width="2.5" />
    <line x1="9" y1="15" x2="12" y2="15" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="9" y1="20" x2="12" y2="20" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="9" y1="25" x2="12" y2="25" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="15" x2="31" y2="15" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="20" x2="31" y2="20" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="25" x2="31" y2="25" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="15" y1="9" x2="15" y2="12" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="9" x2="20" y2="12" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="25" y1="9" x2="25" y2="12" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="15" y1="28" x2="15" y2="31" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="28" x2="20" y2="31" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="25" y1="28" x2="25" y2="31" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="20" cy="20" r="3" fill="#4F46E5" />
  </g>

  <!-- 2. Analytics Chart Icon -->
  <g transform="translate(180, 60)" filter="url(#soft-shadow)">
    <circle cx="20" cy="20" r="24" fill="#FFFFFF" />
    <rect x="12" y="12" width="16" height="16" rx="1.5" fill="none" stroke="#4F46E5" stroke-width="2" />
    <line x1="16" y1="24" x2="16" y2="20" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="24" x2="20" y2="16" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="24" x2="24" y2="18" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="14" r="1" fill="#4F46E5" />
    <circle cx="24" cy="14" r="1" fill="#4F46E5" />
  </g>

  <!-- 3. People / Class Icon -->
  <g transform="translate(280, 40)" filter="url(#soft-shadow)">
    <circle cx="20" cy="20" r="26" fill="#FFFFFF" />
    <circle cx="20" cy="16" r="4.5" fill="none" stroke="#4F46E5" stroke-width="2" />
    <path d="M12,25 C12,21 15,20 20,20 C25,20 28,21 28,25" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <circle cx="14" cy="18" r="3" fill="none" stroke="#4F46E5" stroke-width="1.5" />
    <path d="M8,25 C8,22 10,21.5 13,21.5" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="26" cy="18" r="3" fill="none" stroke="#4F46E5" stroke-width="1.5" />
    <path d="M32,25 C32,22 30,21.5 27,21.5" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 4. Document / Resume Icon -->
  <g transform="translate(380, 60)" filter="url(#soft-shadow)">
    <circle cx="20" cy="20" r="24" fill="#FFFFFF" />
    <rect x="13" y="11" width="14" height="18" rx="1.5" fill="none" stroke="#4F46E5" stroke-width="2" />
    <line x1="16" y1="15" x2="20" y2="15" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="19" x2="24" y2="19" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="23" x2="22" y2="23" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 5. Brain / AI Learning Icon -->
  <g transform="translate(420, 160)" filter="url(#soft-shadow)">
    <circle cx="20" cy="20" r="28" fill="#FFFFFF" />
    <circle cx="20" cy="20" r="28" fill="#4F46E5" opacity="0.1" />
    <!-- Human brain profile outline -->
    <path d="M14,19 C12,19 11,20 11,22 C11,25 13,27 15,27 C15,29 17,30 20,30 C23,30 24,28 25,27 C27,27 29,25 29,22 C29,19 27,17 25,17 C25,15 23,13 20,13 C17,13 15,15 14,17 C13,17 14,19 14,19 Z" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tech nodes in brain -->
    <circle cx="20" cy="17" r="1.5" fill="#4F46E5" />
    <circle cx="16" cy="22" r="1.5" fill="#4F46E5" />
    <circle cx="24" cy="22" r="1.5" fill="#4F46E5" />
    <circle cx="20" cy="26" r="1.5" fill="#4F46E5" />
    <line x1="20" y1="17" x2="16" y2="22" stroke="#4F46E5" stroke-width="1" />
    <line x1="20" y1="17" x2="24" y2="22" stroke="#4F46E5" stroke-width="1" />
    <line x1="16" y1="22" x2="20" y2="26" stroke="#4F46E5" stroke-width="1" />
    <line x1="24" y1="22" x2="20" y2="26" stroke="#4F46E5" stroke-width="1" />
  </g>

  <!-- Laptop Centerpiece -->
  <g transform="translate(150, 180)">
    <!-- Laptop screen shell -->
    <rect x="40" y="30" width="220" height="150" rx="8" fill="#1E1B4B" filter="url(#soft-shadow)" />
    <!-- Laptop Screen Inner Display -->
    <rect x="46" y="36" width="208" height="136" rx="4" fill="#FFFFFF" />
    <rect x="46" y="36" width="208" height="136" rx="4" fill="#F3F4F6" />
    
    <!-- Acadrium logo icon on laptop screen -->
    <!-- Cap top -->
    <polygon points="150,65 185,80 150,95 115,80" fill="#4F46E5" />
    <!-- Cap base -->
    <path d="M130,86 L130,98 C130,108 170,108 170,98 L170,86 L150,95 Z" fill="#4F46E5" />
    <!-- Book -->
    <path d="M132,112 C140,107 150,110 150,113 C150,110 160,107 168,112 L168,122 C160,117 150,120 150,123 C150,120 140,117 132,122 Z" fill="#4F46E5" />
    <path d="M150,113 L150,123" stroke="#EEF2FF" stroke-width="1" />
    
    <!-- Screen Reflection / Gloss -->
    <path d="M46,36 L150,36 L46,140 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- Laptop hinge -->
    <rect x="130" y="180" width="40" height="6" fill="#6B7280" />
    <!-- Laptop Keyboard Base -->
    <path d="M10,183 L290,183 L310,198 L-10,198 Z" fill="#E5E7EB" />
    <path d="M-10,198 L310,198 C310,204 290,208 270,208 L30,208 C10,208 -10,204 -10,198 Z" fill="#D1D5DB" />
    <!-- Laptop Trackpad -->
    <rect x="125" y="190" width="50" height="12" rx="2" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="0.5" />
  </g>

  <!-- Book stack on the left -->
  <g transform="translate(80, 240)" filter="url(#soft-shadow)">
    <!-- Book 1 (Bottom - Blue) -->
    <path d="M10,80 L130,80 L125,100 L5,100 Z" fill="#2563EB" />
    <path d="M130,80 L140,84 L135,104 L125,100 Z" fill="#1D4ED8" />
    <path d="M5,100 L125,100 L130,102 L10,102 Z" fill="#93C5FD" />
    <rect x="8" y="83" width="114" height="4" fill="#FFFFFF" opacity="0.3" />

    <!-- Book 2 (Middle - Purple) -->
    <path d="M20,60 L125,60 L120,78 L15,78 Z" fill="#7C3AED" />
    <path d="M125,60 L133,64 L128,82 L120,78 Z" fill="#6D28D9" />
    <path d="M15,78 L120,78 L125,80 L20,80 Z" fill="#C084FC" />
    <rect x="17" y="63" width="100" height="4" fill="#FFFFFF" opacity="0.3" />

    <!-- Book 3 (Top - Turquoise) -->
    <path d="M15,42 L115,42 L110,58 L10,58 Z" fill="#0D9488" />
    <path d="M115,42 L122,45 L117,61 L110,58 Z" fill="#0F766E" />
    <path d="M10,58 L110,58 L113,60 L13,60 Z" fill="#5EEAD4" />
    <rect x="12" y="45" width="94" height="3" fill="#FFFFFF" opacity="0.3" />
  </g>

  <!-- Pen Cup on the right -->
  <g transform="translate(420, 240)" filter="url(#soft-shadow)">
    <!-- Cup body -->
    <rect x="15" y="60" width="50" height="80" rx="6" fill="#0D9488" />
    <rect x="15" y="60" width="50" height="15" fill="#115E59" opacity="0.2" />
    <text x="40" y="105" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" opacity="0.4" text-anchor="middle" letter-spacing="1">MARK</text>

    <!-- Red Pen -->
    <path d="M22,60 L22,25 C22,23 27,23 27,25 L27,60 Z" fill="#EF4444" />
    <path d="M22,25 L24.5,15 L27,25 Z" fill="#F87171" />
    <rect x="23.5" y="30" width="2" height="20" fill="#B91C1C" />

    <!-- Blue Marker -->
    <path d="M38,60 L38,20 C38,18 45,18 45,20 L45,60 Z" fill="#3B82F6" />
    <path d="M38,20 L41.5,8 L45,20 Z" fill="#60A5FA" />
    <rect x="40.5" y="28" width="3" height="25" fill="#1D4ED8" />
    <!-- Clip -->
    <rect x="44" y="25" width="3" height="18" rx="1" fill="#1E3A8A" />
  </g>
</svg>
